name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # CPU torch keeps the torch-dependent unit tests (decoder prompt grammar,
      # LLM token selection) runnable; GPU tests self-skip.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
